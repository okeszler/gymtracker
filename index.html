<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kratos' GymTracker</title>
<meta name="description" content="Trainingserfassung für Kratos & Atreus.">
<meta name="theme-color" content="#101315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTracker">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root {
    --bg: #101315;
    --accent: #ffc53d;
    --muted: #8a949c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* ---------- App-Frame ---------- */
  #app {
    position: fixed; inset: 0; border: none; width: 100%; height: 100%;
    opacity: 0; transition: opacity .5s ease;
  }
  #app.sichtbar { opacity: 1; }

  /* ---------- Splash ---------- */
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: var(--bg); z-index: 10;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #splash.weg { opacity: 0; visibility: hidden; pointer-events: none; }

  .logo-wrap { position: relative; width: 96px; height: 96px; }
  .logo-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,197,61,.18);
    border-top-color: var(--accent);
    animation: spin 1.1s linear infinite;
  }
  .logo-axt {
    position: absolute; inset: 18px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .logo-axt svg { width: 100%; height: 100%; display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(.9); opacity: .75; }
  }

  #splashText {
    font-family: 'Archivo', 'Inter', sans-serif; font-weight: 900;
    letter-spacing: .08em; text-transform: uppercase; font-size: 13px;
    color: var(--muted); opacity: 0; animation: fadeIn .6s ease .3s forwards;
  }
  #splashText span { color: var(--accent); }

  @keyframes fadeIn { to { opacity: 1; } }

  /* ---------- Fehlerzustand ---------- */
  #fehler {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 32px;
    background: var(--bg); color: var(--muted); text-align: center;
    font-size: 14px; z-index: 11;
  }
  #fehler.zeigen { display: flex; }
  #fehler a {
    color: var(--accent); text-decoration: none; font-weight: 600;
    border: 1px solid rgba(255,197,61,.4); border-radius: 10px;
    padding: 10px 18px; margin-top: 4px;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-axt">
      <svg viewBox="0 0 100 100">
        <g fill="#ffc53d">
          <rect x="46" y="19" width="8" height="62" rx="4"/>
          <path d="M54 34 L75 32 L81 51.5 L73 64 L54 60 Z"/>
          <path d="M46 34 L25 32 L19 51.5 L27 64 L46 60 Z"/>
        </g>
      </svg>
    </div>
  </div>
  <div id="splashText">Kratos' <span>GymTracker</span></div>
</div>

<div id="fehler">
  <div id="splashText" style="animation:none;opacity:1">Verbindung fehlgeschlagen</div>
  <div>Die App ist gerade nicht erreichbar — kurz warten und neu laden, oder direkt öffnen:</div>
  <a id="direktLink" href="#" target="_top">Direkt öffnen</a>
</div>

<iframe id="app" title="Kratos' GymTracker"></iframe>

<script>
  // ── Hier die aktuelle Apps-Script-Bereitstellungs-URL eintragen ──
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbwmOO36cWhJGZR8oL5n3HN4-JmZ-BQ-8e4vmAj9fSnL9RbgbIDaa2DswHdxFKzP3fA/exec";

  const params = new URLSearchParams(location.search);
  const person = params.get('person');
  const zielUrl = person ? `${EXEC_URL}?person=${encodeURIComponent(person)}` : EXEC_URL;

  const frame = document.getElementById('app');
  const splash = document.getElementById('splash');
  const fehlerBox = document.getElementById('fehler');
  document.getElementById('direktLink').href = zielUrl;

  let geladen = false;
  const timeout = setTimeout(() => {
    if (!geladen) fehlerBox.classList.add('zeigen');
  }, 9000);

  frame.addEventListener('load', () => {
    geladen = true;
    clearTimeout(timeout);
    // Kleine Mindestdauer, damit die Splash-Animation nicht "flackert"
    setTimeout(() => {
      splash.classList.add('weg');
      frame.classList.add('sichtbar');
    }, 350);
  });

  frame.src = zielUrl;
</script>
</body>
</html>
