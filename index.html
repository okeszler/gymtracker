<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kratos' GymTracker</title>
<meta name="description" content="Trainingserfassung für Kratos & Atreus.">
<meta name="theme-color" content="#0a0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTracker">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root {
    --bg: #0a0b0c;
    --accent: #ffc53d;
    --accent-2: #ff9a1f;
    --muted: #8b949b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* ---------- App-Frame (Notch/Home-Indicator bleiben frei) ---------- */
  #app {
    position: fixed; border: none;
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    opacity: 0; transition: opacity .5s ease;
  }
  #app.sichtbar { opacity: 1; }

  /* ---------- Splash ---------- */
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; z-index: 10;
    background: radial-gradient(90% 50% at 50% 40%, rgba(255,197,61,.09), transparent 70%), var(--bg);
    transition: opacity .45s ease, visibility .45s ease, transform .45s ease;
  }
  #splash.weg { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.04); }

  .hantel { width: 104px; height: 104px; animation: heben 1.4s cubic-bezier(.45,0,.25,1) infinite; }
  .hantel .scheibe { transform-box: fill-box; transform-origin: center; animation: scheibe 1.4s ease-in-out infinite; }
  @keyframes heben {
    0%, 100% { transform: translateY(8px) rotate(-35deg); }
    50% { transform: translateY(-10px) rotate(-35deg); }
  }
  @keyframes scheibe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }

  .schatten { width: 70px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.6);
    margin-top: -18px; animation: schatten 1.4s cubic-bezier(.45,0,.25,1) infinite; }
  @keyframes schatten { 0%, 100% { transform: scaleX(1); opacity: .8; } 50% { transform: scaleX(.65); opacity: .4; } }

  #splashText {
    font-weight: 900; letter-spacing: .14em; text-transform: uppercase; font-size: 14px;
    color: #f3f4f5; opacity: 0; animation: fadeIn .6s ease .25s forwards;
  }
  #splashText span { color: var(--accent); }
  .ladebalken { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden;
    opacity: 0; animation: fadeIn .6s ease .4s forwards; }
  .ladebalken i { display: block; height: 100%; width: 40%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: balken 1.1s ease-in-out infinite; }
  @keyframes balken { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ---------- Fehlerzustand ---------- */
  #fehler {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 32px;
    background: var(--bg); color: var(--muted); text-align: center;
    font-size: 15px; line-height: 1.5; z-index: 11;
  }
  #fehler.zeigen { display: flex; }
  #fehler .titel { color: #f3f4f5; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; font-size: 15px; }
  .knoepfe { display: flex; gap: 10px; margin-top: 6px; }
  #fehler a, #fehler button {
    font: 700 15px system-ui, sans-serif; text-decoration: none; border-radius: 12px; padding: 12px 18px; cursor: pointer;
  }
  #fehler button { border: 0; color: #1a1300; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  #fehler a { color: var(--accent); border: 1px solid rgba(255,197,61,.4); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div id="splash">
  <svg class="hantel" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd25e"/><stop offset="1" stop-color="#ff9a1f"/>
      </linearGradient>
    </defs>
    <g fill="url(#g)">
      <rect x="24" y="46" width="52" height="8" rx="3"/>
      <rect class="scheibe" x="27" y="27" width="11" height="46" rx="4"/>
      <rect class="scheibe" x="62" y="27" width="11" height="46" rx="4"/>
      <rect x="16" y="35" width="9" height="30" rx="3.5"/>
      <rect x="75" y="35" width="9" height="30" rx="3.5"/>
    </g>
  </svg>
  <div class="schatten"></div>
  <div id="splashText">Kratos' <span>GymTracker</span></div>
  <div class="ladebalken"><i></i></div>
</div>

<div id="fehler">
  <div class="titel">Verbindung dauert</div>
  <div>Die App antwortet gerade nicht — schlechter Empfang im Gym?<br>Neu laden oder direkt öffnen:</div>
  <div class="knoepfe">
    <button id="neuLaden">Neu laden</button>
    <a id="direktLink" href="#" target="_top">Direkt öffnen</a>
  </div>
</div>

<iframe id="app" title="Kratos' GymTracker" allow="autoplay"></iframe>

<script>
  // ── Hier die aktuelle Apps-Script-Bereitstellungs-URL eintragen ──
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbwmOO36cWhJGZR8oL5n3HN4-JmZ-BQ-8e4vmAj9fSnL9RbgbIDaa2DswHdxFKzP3fA/exec";

  const params = new URLSearchParams(location.search);
  const person = params.get('person');
  const zielUrl = person ? `${EXEC_URL}?person=${encodeURIComponent(person)}` : EXEC_URL;

  const frame = document.getElementById('app');
  const splash = document.getElementById('splash');
  const fehlerBox = document.getElementById('fehler');
  document.getElementById('direktLink').href = zielUrl;

  let timeout;
  function starte() {
    fehlerBox.classList.remove('zeigen');
    clearTimeout(timeout);
    // Apps Script braucht beim Kaltstart gern mal länger — erst nach 15 s Alarm schlagen.
    timeout = setTimeout(() => fehlerBox.classList.add('zeigen'), 15000);
    frame.src = zielUrl;
  }

  frame.addEventListener('load', () => {
    clearTimeout(timeout);
    fehlerBox.classList.remove('zeigen'); // falls die App nach dem Timeout doch noch kam
    // Kleine Mindestdauer, damit die Splash-Animation nicht "flackert"
    setTimeout(() => {
      splash.classList.add('weg');
      frame.classList.add('sichtbar');
    }, 350);
  });

  document.getElementById('neuLaden').addEventListener('click', () => {
    splash.classList.remove('weg');
    frame.classList.remove('sichtbar');
    starte();
  });

  starte();
</script>
</body>
</html>
